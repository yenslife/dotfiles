set -g default-terminal "screen-256color"
set -g prefix C-a

unbind C-b
bind-key C-a send-prefix

# fix tmux nvim navigator
set -g focus-events on

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

set-option -g history-limit 100000

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
set -s set-clipboard on
set -as terminal-features ',screen-256color:Ms'


unbind -T copy-mode-vi MouseDragEnd1Pane 

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sensible' # 有很多預設好用的設定
# set -g @plugin 'Ataraxy-Labs/opensessions'

# 只改這一行：day = Powerline Day；night = Powerline Cyan
# 記得用 prefix + r 來 reload setting
set -g @appearance 'night'
set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5' # save every 15 minutes

# 初始化 TPM，最後再套用選定主題
run '~/.tmux/plugins/tpm/tpm'

# 先還原原版 Cyan；白天只覆寫外觀，資訊內容沿用外掛設定
setw -g window-status-style default
setw -g window-status-bell-style default
run '~/.tmux/plugins/tmux-themepack/themepack.tmux'
if-shell -F '#{==:#{@appearance},day}' {
  set -g status-style 'fg=#666666,bg=#ffffff'
  set -g status-left-style 'fg=#000000,bg=#ffffff'
  set -g status-right-style 'fg=#000000,bg=#ffffff'
  set -gF status-left '#[fg=#0000b2,bg=#a4c9ff,bold] #{@themepack-status-left-area-left-format} #[fg=#a4c9ff,bg=#e5e5e5,nobold]#[fg=#000000,bg=#e5e5e5] #{@themepack-status-left-area-middle-format} #[fg=#e5e5e5,bg=#f2f2f2]#[fg=#666666,bg=#f2f2f2] #{@themepack-status-left-area-right-format} #[fg=#f2f2f2,bg=#ffffff]'
  set -gF status-right '#[fg=#f2f2f2,bg=#ffffff]#[fg=#666666,bg=#f2f2f2] #{@themepack-status-right-area-left-format} #[fg=#e5e5e5,bg=#f2f2f2]#[fg=#000000,bg=#e5e5e5] #{@themepack-status-right-area-middle-format} #[fg=#a4c9ff,bg=#e5e5e5]#[fg=#0000b2,bg=#a4c9ff,bold] #{@themepack-status-right-area-right-format} '
  setw -g window-status-style 'fg=#666666,bg=#ffffff'
  setw -g window-status-current-style 'fg=#0000b2,bg=#a4c9ff'
  setw -gF window-status-current-format '#[fg=#ffffff,bg=#a4c9ff]#[fg=#0000b2,bg=#a4c9ff,bold] #{@themepack-window-status-current-format} #[fg=#ffffff,bg=#a4c9ff,nobold]'
  setw -g window-status-activity-style 'fg=#b200b2,bg=#ffffff'
  setw -g window-status-bell-style 'fg=#990000,bg=#ffffff'
  setw -g pane-border-style 'fg=#cccccc,bg=default'
  setw -g pane-active-border-style 'fg=#0000b2,bg=default'
  setw -g mode-style 'fg=#000000,bg=#a4c9ff'
  set -g message-style 'fg=#000000,bg=#f2f2f2'
  set -g message-command-style 'fg=#0000b2,bg=#a4c9ff'
  set -g display-panes-colour '#666666'
  set -g display-panes-active-colour '#0000b2'
  setw -g clock-mode-colour '#0000b2'
}
