set -g default-terminal "screen-256color"
set -g prefix C-a

unbind C-b
bind-key C-a send-prefix

# fix tmux nvim navigator
set -g focus-events on

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

set-option -g history-limit 100000

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
set -s set-clipboard on
set -as terminal-features ',screen-256color:Ms'


unbind -T copy-mode-vi MouseDragEnd1Pane 

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sensible' # 有很多預設好用的設定
# set -g @plugin 'Ataraxy-Labs/opensessions'

# 只改這一行：day = Powerline Day；night = Powerline Cyan
# 記得用 prefix + r 來 reload setting
set -g @appearance 'night'
set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5' # save every 15 minutes

# 初始化 TPM，最後再套用選定主題
run '~/.tmux/plugins/tpm/tpm'

# 先還原原版 Cyan；白天只覆寫外觀，資訊內容沿用外掛設定
setw -g window-status-style default
setw -g window-status-bell-style default
run '~/.tmux/plugins/tmux-themepack/themepack.tmux'
if-shell -F '#{==:#{@appearance},day}' {
  set -g status-style 'fg=#6c6c72,bg=#faf9f6'
  set -g status-left-style 'fg=#242426,bg=#faf9f6'
  set -g status-right-style 'fg=#242426,bg=#faf9f6'
  set -gF status-left '#[fg=#005fbd,bg=#cfe3ff,bold] #{@themepack-status-left-area-left-format} #[fg=#cfe3ff,bg=#e5e4e0,nobold]#[fg=#242426,bg=#e5e4e0] #{@themepack-status-left-area-middle-format} #[fg=#e5e4e0,bg=#f0efec]#[fg=#6c6c72,bg=#f0efec] #{@themepack-status-left-area-right-format} #[fg=#f0efec,bg=#faf9f6]'
  set -gF status-right '#[fg=#f0efec,bg=#faf9f6]#[fg=#6c6c72,bg=#f0efec] #{@themepack-status-right-area-left-format} #[fg=#e5e4e0,bg=#f0efec]#[fg=#242426,bg=#e5e4e0] #{@themepack-status-right-area-middle-format} #[fg=#cfe3ff,bg=#e5e4e0]#[fg=#005fbd,bg=#cfe3ff,bold] #{@themepack-status-right-area-right-format} '
  setw -g window-status-style 'fg=#6c6c72,bg=#faf9f6'
  setw -g window-status-current-style 'fg=#005fbd,bg=#cfe3ff'
  setw -gF window-status-current-format '#[fg=#faf9f6,bg=#cfe3ff]#[fg=#005fbd,bg=#cfe3ff,bold] #{@themepack-window-status-current-format} #[fg=#faf9f6,bg=#cfe3ff,nobold]'
  setw -g window-status-activity-style 'fg=#8641a4,bg=#faf9f6'
  setw -g window-status-bell-style 'fg=#b42332,bg=#faf9f6'
  setw -g pane-border-style 'fg=#c9c8c4,bg=default'
  setw -g pane-active-border-style 'fg=#005fbd,bg=default'
  setw -g mode-style 'fg=#1d304d,bg=#cfe3ff'
  set -g message-style 'fg=#242426,bg=#f0efec'
  set -g message-command-style 'fg=#005fbd,bg=#cfe3ff'
  set -g display-panes-colour '#6c6c72'
  set -g display-panes-active-colour '#005fbd'
  setw -g clock-mode-colour '#005fbd'
}
